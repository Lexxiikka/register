<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Реестр всех</title>
    <link rel="icon" type="image/png" href="assets/icon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121214;
        }

        .global {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        .selector {
            flex: 1;
            height: 100%;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .selector img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            filter: brightness(0.2) blur(4px);
            transform: scale(1.05);
            transition: filter 0.4s ease, transform 0.4s ease;
        }

        .selector:hover img {
            filter: brightness(1) blur(0px);
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div class="global">
        <div class="selector" id="selector_left">
            <img src="assets/left.png" alt="LEFT">
        </div>
        <div class="selector" id="selector_center">
            <img src="assets/center.png" alt="CENTER">
        </div>
        <div class="selector" id="selector_right">
            <img src="assets/right.png" alt="RIGHT">
        </div>
    </div>
</body>

</html>
